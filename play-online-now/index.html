<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirigiendo a BetSala...</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<link rel="icon" type="image/webp" href="/assets/favicon.webp">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="redirect-page">
  <div>
    <div class="spinner"></div>
    <h1>Redirigiendo a <span style="color:var(--accent-soft)">BetSala</span>...</h1>
    <p>Estamos llevándote al sitio oficial de BetSala 11 Chile.</p>
    <p>Por favor espera unos segundos.</p>
    <div class="manual">
      Si la redirección no funciona,
      <a id="manual-link" href="#" rel="nofollow noopener noreferrer sponsored">haz clic aquí</a>.
    </div>
  </div>
</div>
<script>
/**
 * BetSala affiliate redirect.
 * Replace REFERRAL_URL with your tracking link.
 */
(function () {
  var REFERRAL_URL = 'https://www.betsala11.com/es/'; // <-- ВСТАВЬ СЮДА СВОЮ РЕФЕРАЛЬНУЮ ССЫЛКУ
  try {
    var currentParams = new URLSearchParams(window.location.search);
    var passThrough = ['utm_source','utm_medium','utm_campaign','utm_term','utm_content','sub','sub_id','clickid','gclid'];
    var url = new URL(REFERRAL_URL);
    passThrough.forEach(function (k) {
      if (currentParams.has(k) && !url.searchParams.has(k)) {
        url.searchParams.set(k, currentParams.get(k));
      }
    });
    REFERRAL_URL = url.toString();
  } catch (e) { }
  document.getElementById('manual-link').setAttribute('href', REFERRAL_URL);
  setTimeout(function () { window.location.replace(REFERRAL_URL); }, 1500);
})();
</script>
</body>
</html>
